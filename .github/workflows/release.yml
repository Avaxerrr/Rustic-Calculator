name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  windows-release:
    name: Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use stable Rust
        run: rustup default stable

      - name: Build release executable
        run: cargo build --release --locked

      - name: Package release
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $packageName = "rustic-calculator-$version-windows-x64"
          $packageDir = "dist/$packageName"

          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item "target/release/rustic-calculator.exe" "$packageDir/rustic-calculator.exe"
          Copy-Item "README.md" "$packageDir/README.md"
          Copy-Item "LICENSE" "$packageDir/LICENSE"

          Compress-Archive -Path "$packageDir/*" -DestinationPath "dist/$packageName.zip" -Force

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustic-calculator-windows-x64
          path: dist/*.zip
          if-no-files-found: error

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $title = "Rustic Calculator $tag"
          $notes = @"
          ## Rustic Calculator $tag

          Windows x64 release build for Rustic Calculator.

          ### Highlights
          - Standard calculator with keyboard input and calculation history.
          - Unit converters for volume, length, weight and mass, temperature, energy, area, speed, time, power, data, pressure, and angle.
          - Dark Windows-style desktop UI.
          - Persistent window size and position.

          ### Download
          Download `rustic-calculator-$tag-windows-x64.zip`, extract it, and run `rustic-calculator.exe`.
          "@

          $notesPath = "dist/release-notes.md"
          $notes | Set-Content -Path $notesPath -Encoding UTF8

          if (gh release view $tag *> $null) {
            gh release edit $tag --title $title --notes-file $notesPath
            gh release upload $tag dist/*.zip --clobber
          } else {
            gh release create $tag dist/*.zip --title $title --notes-file $notesPath
          }
